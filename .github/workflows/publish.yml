# tag 自动发布：bun run release 打 v* tag 并推送后，CI 测试并发布到 npm
name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance 来源证明需要
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck

      - name: 单元测试
        run: bun test

      - name: 构建
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing（OIDC）要求 npm CLI ≥11.5.1，node 22 自带的 npm 10 不够
      - name: 升级 npm
        run: npm install -g npm@latest

      # OIDC 免 token 发布：无需 NODE_AUTH_TOKEN，身份由 GitHub OIDC 短时令牌提供，
      # 需在 npmjs.com 包设置页将 Trusted Publisher 配置为本仓库与本 workflow 文件名
      - name: 发布到 npm
        run: npm publish --provenance
